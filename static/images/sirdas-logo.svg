<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="sirdas-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Chat bubble body -->
  <rect x="3" y="2" width="34" height="26" rx="8" fill="url(#sirdas-grad)"/>
  <!-- Chat bubble tail -->
  <polygon points="9,28 9,37 18,28" fill="url(#sirdas-grad)"/>
  <!-- Neural triangle: top node (AI core) -->
  <circle cx="20" cy="11" r="3.2" fill="white" opacity="0.95"/>
  <!-- Neural triangle: bottom-left node -->
  <circle cx="12.5" cy="22" r="2.2" fill="white" opacity="0.7"/>
  <!-- Neural triangle: bottom-right node -->
  <circle cx="27.5" cy="22" r="2.2" fill="white" opacity="0.7"/>
  <!-- Connections -->
  <line x1="20" y1="11" x2="12.5" y2="22" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <line x1="20" y1="11" x2="27.5" y2="22" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <line x1="12.5" y1="22" x2="27.5" y2="22" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <!-- Pulse ring around core -->
  <circle cx="20" cy="11" r="6" fill="none" stroke="white" stroke-width="0.8" opacity="0.2"/>
</svg>
