<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sırdaş AI | Sistem Girişi</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- SIRDAŞ V3 BEYAZ & GLASSMORPHISM TEMA --- */
        body {
            background-color: #f5f7fa; /* Ferah ve temiz arka plan */
            background-image: radial-gradient(circle at top right, rgba(37, 99, 235, 0.05), transparent 400px); /* Sağ üstte çok hafif kurumsal mavi parlama */
            color: #1e293b; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        /* BUZLU CAM GİRİŞ KARTI */
        .login-card {
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04);
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
        }

        .login-title {
            color: #1e293b;
            font-weight: 800;
            letter-spacing: -0.5px;
            font-size: 1.8rem;
        }

        .form-label {
            color: #475569;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        /* İNPUT ALANLARI */
        .form-control {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            color: #1e293b;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        /* GİRİŞ BUTONU */
        .btn-primary {
            background-color: #2563eb;
            border: none;
            font-weight: 600;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3);
        }

        /* GERİ DÖNÜŞ LİNKİ */
        .back-link {
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s ease;
            display: inline-flex;
            align-items: center;
        }

        .back-link:hover {
            color: #2563eb;
        }

        /* HATA MESAJI (Jinja ile gelen) */
        .alert-danger {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #ef4444;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-5">
            <h2 class="login-title">
                <i class="fas fa-fingerprint me-2 text-primary" style="color: #2563eb !important;"></i>Sistem Yetkilendirme
            </h2>
            <p class="text-muted mt-2" style="font-size: 0.95rem;">Yönetici paneline erişim sağlayın</p>
        </div>
        
        {% if error %}
        <div class="alert alert-danger text-center py-3 mb-4" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="mb-4">
                <label class="form-label"><i class="fas fa-user-astronaut me-2"></i>Kullanıcı Kimliği</label>
                <input type="text" name="username" class="form-control" placeholder="Admin kullanıcı adınız" required autocomplete="off">
            </div>
            <div class="mb-5">
                <label class="form-label"><i class="fas fa-key me-2"></i>Erişim Şifresi</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-4">
                Sisteme Giriş Yap <i class="fas fa-arrow-right ms-2"></i>
            </button>
        </form>
        <div class="text-center">
            <a href="/" class="back-link">
                <i class="fas fa-arrow-left me-2"></i> Ana Ekrana Dön
            </a>
        </div>
    </div>
</body>
</html>
