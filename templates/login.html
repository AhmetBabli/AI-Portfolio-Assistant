<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sırdaş AI | Sistem Girişi</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- SIRDAŞ V3 ULTRA-GLASSMORPHISM BEYAZ TEMA --- */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* CAM EFEKTİNİ PATLATAN ARKA PLAN BLR KÜRELERİ (BLOBS) */
        .bg-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.12) 0%, transparent 70%);
            filter: blur(40px);
            z-index: -1;
        }
        .blob-1 { top: -10%; right: -10%; }
        .blob-2 { bottom: -10%; left: -10%; }

        /* PREMIUM BUZLU CAM KART */
        .login-card {
            background-color: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.04), 
                        0 1px 3px rgba(15, 23, 42, 0.02);
            padding: 3.5rem 2.5rem;
            width: 100%;
            max-width: 430px;
            transition: transform 0.3s ease;
        }

        .login-title {
            color: var(--text-main);
            font-weight: 800;
            letter-spacing: -0.75px;
            font-size: 1.85rem;
        }

        .login-title i {
            color: var(--primary);
        }

        .form-label {
            color: #475569;
            font-weight: 600;
            font-size: 0.88rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        /* İNPUT ALANLARI VE ŞİFRE GRUBU */
        .form-control {
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #cbd5e1;
            color: var(--text-main);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        /* Şifre gizle/göster grubu için özel sarmalayıcı */
        .password-wrapper {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            font-size: 1rem;
            z-index: 10;
        }
        
        .password-toggle:hover {
            color: var(--text-main);
        }

        /* INTERACTIVE BUTTON */
        .btn-primary {
            background-color: var(--primary);
            border: none;
            font-weight: 600;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.98rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .alert-danger {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #ef4444;
            border-radius: 14px;
            font-weight: 500;
            font-size: 0.88rem;
            animation: shake 0.4s linear;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
    </style>
</head>
<body>

    <!-- Arka Plan Derinlik Küreleri -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="login-card">
        <div class="text-center mb-4">
            <h2 class="login-title">
                <i class="fas fa-fingerprint me-2"></i>Sistem Yetkilendirme
            </h2>
            <p class="text-muted mt-2" style="font-size: 0.92rem;">Yönetici paneline güvenli erişim sağlayın</p>
        </div>
        
        {% if error %}
        <div class="alert alert-danger text-center py-3 mb-4" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" id="loginForm">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            
            <div class="mb-4">
                <label for="username" class="form-label">
                    <i class="fas fa-user-astronaut me-2 text-muted"></i>Kullanıcı Kimliği
                </label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Admin kullanıcı adı" required autocomplete="off">
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">
                    <i class="fas fa-key me-2 text-muted"></i>Erişim Şifresi
                </label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" id="togglePasswordBtn" onclick="togglePassword()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mb-4" id="submitBtn">
                <span id="btnText">Sisteme Giriş Yap <i class="fas fa-arrow-right ms-2"></i></span>
            </button>
        </form>
        
        <div class="text-center">
            <a href="/" class="back-link">
                <i class="fas fa-arrow-left"></i> Ana Ekrana Dön
            </a>
        </div>
    </div>

    <!-- UX Etkileşim Scripti -->
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Form gönderildiğinde çift tıklamayı önleyen loading animasyonu tetikleyici
        document.getElementById('loginForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            btn.disabled = true;
            btnText.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Doğrulanıyor...';
        });
    </script>
</body>
</html>
